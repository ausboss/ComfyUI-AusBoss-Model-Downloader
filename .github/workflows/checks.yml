name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python }} and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check --select F,E9 __init__.py downloader tests
      - run: node --test tests/*.test.mjs
      - run: node --check js/model_downloader/index.js
      - run: node --check js/shared/download_controls.mjs
